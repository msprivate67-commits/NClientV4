name: Build

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: build-${{ github.repository }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: Stop and delete previous Actions runs
    runs-on: ubuntu-latest
    steps:
      - name: Remove previous workflow runs and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          repo="repos/${GITHUB_REPOSITORY}"
          mapfile -t old_run_ids < <(
            gh api --paginate "$repo/actions/runs?per_page=100" \
              --jq '.workflow_runs[].id' | grep -vx "$CURRENT_RUN_ID" || true
          )

          if ((${#old_run_ids[@]} == 0)); then
            echo "No previous Actions runs to remove."
            exit 0
          fi

          echo "Stopping ${#old_run_ids[@]} previous Actions run(s)."
          for run_id in "${old_run_ids[@]}"; do
            status="$(gh api "$repo/actions/runs/$run_id" --jq '.status' 2>/dev/null || echo deleted)"
            if [[ "$status" != "completed" && "$status" != "deleted" ]]; then
              gh api --method POST "$repo/actions/runs/$run_id/cancel" >/dev/null || true
            fi
          done

          wait_for_runs() {
            local attempts="$1"
            local attempt active status run_id
            for ((attempt = 1; attempt <= attempts; attempt++)); do
              active=0
              for run_id in "${old_run_ids[@]}"; do
                status="$(gh api "$repo/actions/runs/$run_id" --jq '.status' 2>/dev/null || echo deleted)"
                if [[ "$status" != "completed" && "$status" != "deleted" ]]; then
                  active=$((active + 1))
                fi
              done
              ((active == 0)) && return 0
              sleep 2
            done
            return 1
          }

          if ! wait_for_runs 30; then
            echo "Some runs did not stop normally; force-cancelling them."
            for run_id in "${old_run_ids[@]}"; do
              status="$(gh api "$repo/actions/runs/$run_id" --jq '.status' 2>/dev/null || echo deleted)"
              if [[ "$status" != "completed" && "$status" != "deleted" ]]; then
                gh api --method POST "$repo/actions/runs/$run_id/force-cancel" >/dev/null || true
              fi
            done
            wait_for_runs 15 || {
              echo "Failed to stop every previous Build run."
              exit 1
            }
          fi

          echo "Deleting artifacts and run records."
          for run_id in "${old_run_ids[@]}"; do
            mapfile -t artifact_ids < <(
              gh api --paginate "$repo/actions/runs/$run_id/artifacts?per_page=100" \
                --jq '.artifacts[].id' 2>/dev/null || true
            )
            for artifact_id in "${artifact_ids[@]}"; do
              gh api --method DELETE "$repo/actions/artifacts/$artifact_id" >/dev/null
            done

            deleted=false
            for attempt in {1..5}; do
              if gh api --method DELETE "$repo/actions/runs/$run_id" >/dev/null 2>&1; then
                deleted=true
                break
              fi
              sleep 2
            done
            if [[ "$deleted" != true ]]; then
              echo "Failed to delete workflow run $run_id."
              exit 1
            fi
          done

          echo "Previous Actions runs and artifacts have been removed."

  build-android:
    name: Build (Android arm64-v8a)
    needs: cleanup
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: "27.0.12077973"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: "tools platform-tools build-tools;36.0.0 platforms;android-36 ndk;${{ env.NDK_VERSION }}"

      - name: Export Android environment variables
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          NDK="$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Generate icons
        run: |
          if [ -f src-tauri/icons/icon.png ]; then
            node scripts/make-icons.mjs
            node scripts/make-android-icons.mjs
          else
            echo "No icon.png found, using committed icons"
          fi

      - name: Initialize Tauri Android project when missing
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npx tauri android init --ci
          else
            echo "src-tauri/gen/android already exists, skipping init"
          fi

      - name: Build Android APK
        run: npx tauri android build --apk --target aarch64 --split-per-abi

      - name: Restore Android release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 Actions secret}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nclientv4-release.keystore"
          chmod 600 "$RUNNER_TEMP/nclientv4-release.keystore"

      - name: Sign Android APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD Actions secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS Actions secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD Actions secret}"
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          APK_DIR="src-tauri/gen/android/app/build/outputs/apk"
          shopt -s nullglob
          unsigned_apks=("$APK_DIR"/*/release/*-unsigned.apk)
          if ((${#unsigned_apks[@]} == 0)); then
            echo "No unsigned release APK was produced."
            exit 1
          fi
          for apk in "${unsigned_apks[@]}"; do
            signed="${apk%-unsigned.apk}.apk"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$RUNNER_TEMP/nclientv4-release.keystore" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out "$signed" \
              --in "$apk"
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$signed"
            rm -f "$apk"
          done

      - name: Remove temporary Android keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/nclientv4-release.keystore"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: NClientV4-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
          retention-days: 2
          if-no-files-found: error

  build-windows:
    name: Build (Windows exe + msi)
    needs: cleanup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build Windows standalone application and MSI
        run: npx tauri build --bundles msi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: NClientV4-windows
          path: |
            src-tauri/target/release/nclientv4-bin.exe
            src-tauri/target/release/bundle/msi/**/*.msi
          retention-days: 2
          if-no-files-found: error

  build-linux:
    name: Build (Linux executable + deb)
    needs: cleanup
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build standalone Linux application and DEB package
        run: npx tauri build --bundles deb

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: NClientV4-linux
          path: |
            src-tauri/target/release/nclientv4-bin
            src-tauri/target/release/bundle/deb/**/*.deb
          retention-days: 2
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-linux]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release
          VERSION="$(node -p "require('./package.json').version")"
          echo "BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=NClientV4 v${VERSION}" >> "$GITHUB_ENV"

          windows_exe=$(find artifacts/NClientV4-windows -type f -name "nclientv4-bin.exe" | head -n1 || true)
          [ -n "$windows_exe" ] || { echo "ERROR: no portable Windows executable found"; exit 1; }
          cp "$windows_exe" "release/NClientV4-v${VERSION}-windows.exe"

          windows_msi=$(find artifacts/NClientV4-windows -type f -name "*.msi" | head -n1 || true)
          [ -n "$windows_msi" ] || { echo "ERROR: no Windows MSI found"; exit 1; }
          cp "$windows_msi" "release/NClientV4-v${VERSION}-windows.msi"

          linux_bin=$(find artifacts/NClientV4-linux -type f -name "nclientv4-bin" | head -n1 || true)
          [ -n "$linux_bin" ] || { echo "ERROR: no portable Linux executable found"; exit 1; }
          cp "$linux_bin" "release/NClientV4-v${VERSION}-linux-x86_64"
          chmod +x "release/NClientV4-v${VERSION}-linux-x86_64"

          linux_deb=$(find artifacts/NClientV4-linux -type f -name "*.deb" | head -n1 || true)
          [ -n "$linux_deb" ] || { echo "ERROR: no Linux DEB package found"; exit 1; }
          cp "$linux_deb" "release/NClientV4-v${VERSION}-linux-amd64.deb"

          android_apk=$(find artifacts/NClientV4-android -type f -name "*.apk" | head -n1 || true)
          [ -n "$android_apk" ] || { echo "ERROR: no Android arm64-v8a APK found"; exit 1; }
          cp "$android_apk" "release/NClientV4-v${VERSION}-android-arm64-v8a.apk"

          echo "Staged release assets:"
          ls -la release/

      - name: Replace an existing release for this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Deleting existing release: $RELEASE_TAG"
            gh release delete "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --cleanup-tag \
              --yes
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<EOF
          Official ${RELEASE_TITLE} build from commit [${GITHUB_SHA:0:7}](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}).

          Build time: ${BUILD_TIME}

          ## Downloads
          - Android: arm64-v8a APK
          - Windows: standalone application (no installation required) and MSI installer
          - Linux: standalone x86_64 application (no installation required) and amd64 DEB package
          EOF
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md \
            --latest

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" release/* \
            --repo "$GITHUB_REPOSITORY"
